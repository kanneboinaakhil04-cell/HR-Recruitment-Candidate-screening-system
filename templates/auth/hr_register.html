{% extends "base.html" %}

{% block title %}HR Registration - HR Screening System{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto;">
    <div class="glass-panel" style="padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2 style="font-size: 1.5rem; font-weight: 800;">HR Manager Registration</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.25rem;">Create an HR portal account to post jobs & screen candidates</p>
        </div>

        <form action="{{ url_for('auth.hr_register') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Jane Doe" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="company">Company / Organization Name</label>
                <input type="text" id="company" name="company" class="form-control" placeholder="TechCorp Solutions" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="department">Department</label>
                <input type="text" id="department" name="department" class="form-control" value="Human Resources">
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Work Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your work email" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Create a password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 1rem;">
                <i class="fa-solid fa-user-plus"></i> Register HR Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-secondary);">
            Already registered? <a href="{{ url_for('auth.hr_login') }}" style="color: #8b5cf6; text-decoration: none; font-weight: 600;">HR Login</a>
        </div>
    </div>
</div>
{% endblock %}
